name: Deploy to Pagelove

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagelove-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shop
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: sh
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          PAGELOVE_API_KEY: ${{ secrets.PAGELOVE_API_KEY }}
        run: |
          if [ -z "$PAGELOVE_WEBDAV_URL" ]; then
            echo 'Set the PAGELOVE_WEBDAV_URL variable in the production environment.' >&2
            exit 1
          fi
          case "$PAGELOVE_WEBDAV_URL" in
            https://*|http://*) ;;
            *)
              echo 'PAGELOVE_WEBDAV_URL must be an HTTP or HTTPS URL.' >&2
              exit 1
              ;;
          esac
          case "$PAGELOVE_API_KEY" in
            pk_*) ;;
            *)
              echo 'Set PAGELOVE_API_KEY to a Pagelove API key in the production environment secrets.' >&2
              exit 1
              ;;
          esac

      - name: Deploy and verify the shop
        shell: sh
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          PAGELOVE_API_KEY: ${{ secrets.PAGELOVE_API_KEY }}
        run: ./ops/deploy-pagelove.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pagelove-backup"

      - name: Deploy the optional admin password
        shell: sh
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          PAGELOVE_API_KEY: ${{ secrets.PAGELOVE_API_KEY }}
          PAGELOVE_ADMIN_PASSWORD: ${{ secrets.PAGELOVE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PAGELOVE_ADMIN_PASSWORD" ]; then
            echo 'PAGELOVE_ADMIN_PASSWORD is not set; leaving the live admin credential unchanged.'
            exit 0
          fi
          ./ops/deploy-admin-password.sh "$RUNNER_TEMP/pagelove-admin-backup"
